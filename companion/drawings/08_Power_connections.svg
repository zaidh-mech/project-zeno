   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 303.586187)">One mechanically</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 314.784)">linked DPDT switch</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 428.706516)">COMMON RETURN: USB GND + system GND + boost GND -&gt; OUT-/IN-.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 442.953695)">Only cell negative connects to B-. Do not bypass the protection FETs.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 457.200875)">Unused throws remain open and insulated. Identify pins by continuity.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 471.448055)">5.1k from each CC pin to GND only if not already fitted on the inlet.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 485.695234)"/>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 499.942414)">Internal C3 programming USB: set CHARGE before connection;</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 514.189594)">unplug it before RUN to avoid paralleling PC VBUS and boosted 5 V.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(20.16 528.436773)">Verify idle drain, charge termination, contact rating and temperatures.</text>
   </g>
  </g>
