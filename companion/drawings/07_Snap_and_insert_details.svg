   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 124.123237)">C01: insert trials 4.3 / 4.4 / 4.5 / 4.6</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 138.740347)">Left to right along +X; raised labels omitted.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 153.357456)">C02 + C03: latch and mating receiver</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 167.974566)">C04: 16 x 9 USB cable opening</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 182.591675)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 197.208784)">Tongue radial clearance: 0.35</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 211.825894)">Shell seam gap: 0.35</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 226.443003)">Foam: 0.5 nominal, compressed to 0.35</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 241.060112)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 255.677222)">Estimated snap strain: 0.486%</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 270.294331)">(0.7 deflection / 16.1 effective length)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 284.911441)">Elastic beam estimate only; test PETG.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 299.52855)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 314.145659)">Check insertion and repeated release,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 328.762769)">root cracks, layer adhesion and rattle.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #254441" transform="translate(712.325275 343.379878)">Verify tool access before final assembly.</text>
